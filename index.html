<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Do You Love Me?</title>
  <style>
    body {
      text-align: center;
      margin-top: 80px;
      font-family: sans-serif;
      background-color: #fff0f5;
      overflow: hidden;
    }
    h1 {
      font-size: 2em;
    }
    .btn {
      padding: 10px 20px;
      margin: 10px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      position: absolute;
    }
    #yes {
      background-color: #4caf50;
      color: white;
      position: static;
    }
    .no-btn {
      background-color: #f44336;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Do you love me?</h1>
  <button id="yes" class="btn" onclick="alert('I love you too! 😊')">Yes</button>
  <button id="no" class="btn no-btn">No</button>
  <audio id="sound" src="https://www.myinstants.com/media/sounds/trololo.mp3"></audio>

  <script>
    const noBtn = document.getElementById('no');
    const sound = document.getElementById('sound');

    function randomPosition(btn) {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }

    function addNoButton(event) {
      sound.currentTime = 0;
      sound.play();

      const clone = event.target.cloneNode(true);
      clone.addEventListener('click', addNoButton);
      document.body.appendChild(clone);
      randomPosition(clone);
    }

    noBtn.addEventListener('click', addNoButton);
    noBtn.addEventListener('mouseover', () => randomPosition(noBtn));
  </script>
</body>
</html>
