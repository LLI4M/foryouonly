<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Do You Love Me?</title>
  <style>
    body {
      text-align: center;
      margin-top: 80px;
      font-family: sans-serif;
      background-color: #fff0f5;
      overflow: hidden;
    }
    h1 {
      font-size: 2em;
    }
    .btn {
      padding: 10px 20px;
      margin: 10px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      position: absolute;
    }
    #yes {
      background-color: #4caf50;
      color: white;
      position: static;
    }
    .no-btn {
      background-color: #f44336;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Do you love me?</h1>
  <button id="yes" class="btn" onclick="playYesSound()">Yes</button>
  <button id="no" class="btn no-btn">No</button>

  <!-- Audio for "Yes" and "No" buttons -->
  <audio id="yes-sound" src="https://raw.githubusercontent.com/LLI4M/foryouonly/8393cff5d5ef4870bba0b3f10b427abc724c647b/Yippee%20Meme%20Sound%20Effect%20(HD).mp3"></audio>
  <audio id="no-sound" src="https://raw.githubusercontent.com/LLI4M/foryouonly/refs/heads/main/Pew%20Pew%20Sound.mp3"></audio>

  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const yesSound = document.getElementById('yes-sound');
    const noSound = document.getElementById('no-sound');

    // Function to randomize position
    function randomPosition(btn) {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }

    // Play sound for "Yes" button
    function playYesSound() {
      yesSound.currentTime = 0;
      yesSound.play();
      alert('love you too naa!! 😼');
    }

    // Add new "No" button with sound
    function addNoButton(event) {
      noSound.currentTime = 0;
      noSound.play();

      const clone = event.target.cloneNode(true);
      clone.addEventListener('click', addNoButton);
      document.body.appendChild(clone);
      randomPosition(clone);
    }

    // Event listeners
    noBtn.addEventListener('click', addNoButton);
    noBtn.addEventListener('mouseover', () => randomPosition(noBtn));
  </script>
</body>
</html>
